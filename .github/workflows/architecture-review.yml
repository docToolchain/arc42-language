name: Architecture review

# For every pull request: compare the architecture with the merge base, render
# the changes as one self-contained HTML page per workspace, publish each page
# as an unzipped artifact that opens in the browser (and all of them as one
# zip), and point reviewers to them with a pull request comment (updated in
# place on every push).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  # The report looks up the URLs of this run's artifacts.
  actions: read

concurrency:
  group: architecture-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Workspaces whose architecture is reviewed.
  WORKSPACES: docs/arc42 examples/bookstore-backend examples/kanban-board

jobs:
  review:
    name: Architecture review
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.review.outputs.changed }}
      pages: ${{ steps.review.outputs.pages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The merge base with the target branch must be available.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Review architecture changes
        id: review
        run: >-
          node --experimental-strip-types --no-warnings scripts/architecture-review.ts
          --base "origin/${{ github.base_ref }}" --out architecture-review $WORKSPACES

      # All pages and the summary, zipped: the report job reads the summary, and
      # readers can download every page at once.
      - name: Upload the review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: architecture-review-pr-${{ github.event.pull_request.number }}
          path: architecture-review/
          if-no-files-found: error
          retention-days: 30

  pages:
    name: Review page ${{ matrix.page }}
    needs: review
    if: needs.review.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        page: ${{ fromJSON(needs.review.outputs.pages) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: architecture-review-pr-${{ github.event.pull_request.number }}
          path: architecture-review

      # Unzipped, a single HTML file opens directly in the browser — on mobile too.
      # The artifact is named after the file.
      - name: Upload the page unzipped
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: architecture-review/${{ matrix.page }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  report:
    name: Report
    needs: [review, pages]
    # Also without changes (pages skipped): an existing comment is updated.
    if: always() && needs.review.result == 'success' && needs.pages.result != 'failure' && needs.pages.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: architecture-review-pr-${{ github.event.pull_request.number }}
          path: architecture-review

      - name: Report in the job summary and on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CHANGED: ${{ needs.review.outputs.changed }}
          PAGES: ${{ needs.review.outputs.pages }}
          ZIP_NAME: architecture-review-pr-${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- arc42-architecture-review -->";
            const { owner, repo } = context.repo;

            // Every artifact of this run by name; unzipped pages are named after their file.
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: context.runId,
              per_page: 100,
            });
            const urlOf = (name) => {
              const artifact = artifacts.find((candidate) => candidate.name === name);
              if (!artifact) throw new Error(`No artifact ${name} in run ${context.runId}`);
              return `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`;
            };
            let body = fs
              .readFileSync("architecture-review/summary.md", "utf8")
              .replaceAll("{{ARTIFACT_URL}}", () => urlOf(process.env.ZIP_NAME));
            for (const page of JSON.parse(process.env.PAGES)) {
              body = body.replaceAll(`{{PAGE_URL:${page}}}`, () => urlOf(page));
            }
            const left = /\{\{[A-Z_]+(:[^}]*)?\}\}/.exec(body);
            if (left) throw new Error(`Unresolved placeholder in the summary: ${left[0]}`);
            await core.summary.addRaw(body).write();

            // Pull requests from forks get a read-only token: the job summary has to do.
            const pullRequest = context.payload.pull_request;
            if (pullRequest.head.repo.full_name !== `${owner}/${repo}`) {
              core.notice("Pull request from a fork: see the job summary for the architecture review.");
              return;
            }
            const issue_number = pullRequest.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user?.type === "Bot" && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else if (process.env.CHANGED === "true") {
              // Without architecture changes, only an existing comment is updated.
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
