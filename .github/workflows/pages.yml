name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; new pushes cancel pending runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Build landing page
        run: pnpm run build:site
        env:
          VITE_BASE: /arc42-language/

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r packages/site/dist/. site/
          node packages/cli/dist/cli.mjs --dir docs/arc42 build --out site/docs --base /arc42-language/docs/
          node packages/cli/dist/cli.mjs --dir examples/bookstore-backend build --out site/bookstore --base /arc42-language/bookstore/
          node packages/cli/dist/cli.mjs --dir examples/kanban-board build --out site/kanban-board --base /arc42-language/kanban-board/
          # The bookstore one release later: the evolution story as a live diff with history
          node --experimental-strip-types --no-warnings scripts/bookstore-evolution.ts repo "$RUNNER_TEMP/bookstore-evolution"
          node packages/cli/dist/cli.mjs --dir "$RUNNER_TEMP/bookstore-evolution" build --out site/bookstore-evolution --base /arc42-language/bookstore-evolution/ --diff v1.0 --with-history

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
