<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architecture evolution and drift — arc42-language</title>
    <meta
      name="description"
      content="arc42 compares the architecture model of two versions and shows every change where it lives — with drift between prose and model flagged before merge."
    />
    <script>
      // Apply theme before React hydrates to avoid flash of wrong theme
      (function () {
        var stored = localStorage.getItem("theme");
        if (stored === "dark" || stored === "light") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/evolution.tsx"></script>
  </body>
</html>
